<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eaf5ef"><title>宮古島｜市區美食推薦</title><style>*{box-sizing:border-box}body{margin:0;background:#f8faf5;color:#314b43;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}.wrap{max-width:650px;margin:auto;padding:20px 16px 60px}.hero{background:#e5f3e9;border-radius:24px;padding:23px;margin:12px 0 20px}h1{font-size:26px;margin:8px 0}h2{font-size:18px;margin:0 0 8px}p{line-height:1.65}.muted{color:#687b72;font-size:13px}.back{color:#376c5b;text-decoration:none;font-weight:650}.filters{display:flex;gap:8px;overflow:auto;padding:3px 0 15px}.filters button{white-space:nowrap;border:1px solid #c9dcd1;background:white;padding:10px 14px;border-radius:30px;color:#456457;font-weight:600}.filters button.active{background:#397b66;color:white}.card{background:white;border:1px solid #e0e9e2;border-radius:18px;padding:18px;margin-bottom:12px;box-shadow:0 2px 8px #244b3510}.tag{font-size:12px;background:#edf6ee;border-radius:20px;padding:5px 9px;display:inline-block}.nav{display:block;text-align:center;background:#e5f2ea;color:#286c55;border-radius:12px;padding:12px;text-decoration:none;font-weight:700;margin-top:12px}.notice{background:#fff8e8;padding:13px;border-radius:12px;font-size:13px}</style></head><body><main class="wrap"><a class="back" href="./index.html">← 返回宮古島 APP</a><section class="hero"><div class="muted">🐢 MIYAKO FAMILY TRIP · DAY 2 · 11/19</div><h1>🍽️ 市區美食探險</h1><p>浮潛結束後，大家自由覓食！挑喜歡的料理，點導航就能出發 ♡</p><div class="muted">📍 平良市區及周邊｜自由午餐</div></section><div class="filters" id="filters" aria-label="料理分類"></div><section id="results"></section><p class="notice">⚠️ 餐廳營業日、午餐供應、價格與候位狀況可能變動。出發前請點導航查看店家最新資訊；9 人自由分組用餐較方便。部分店家不一定位於步行範圍內。</p></main><script>const places=[["Doug's Burger","漢堡","🍔","宮古島人氣特色漢堡","¥2,000–3,500","Doug's Burger Miyakojima"],["古謝そば屋","麵食","🍜","傳統宮古蕎麥麵、軟骨排骨麵","¥700–1,300","古謝そば屋 宮古島"],["麺屋サマー太陽","麵食","🍜","特色蝦味麵與味噌麵","請查看菜單","麺屋サマー太陽 宮古島"],["大和食堂","定食","🍱","沖繩家庭料理與宮古麵","¥800–1,500","大和食堂 宮古島"],["BRUAL","漢堡","🍔","美式漢堡與薯條","請查看菜單","BRUAL 宮古島"],["宮古そば どらえもん","麵食","🍜","宮古麵與沖繩特色料理","請查看菜單","宮古そば どらえもん 宮古島"],["RICCO gelato","甜點","🍦","宮古島特色手工義式冰淇淋","依口味及份量","RICCO gelato 宮古島"],["Cafe Uesuya","咖啡","☕","咖啡廳與創意料理","請查看菜單","Cafe Uesuya 宮古島"]];let category="全部";const filters=document.getElementById("filters"),results=document.getElementById("results");function render(){filters.replaceChildren();for(const c of ["全部","漢堡","麵食","定食","甜點","咖啡"]){const b=document.createElement("button");b.textContent=c;b.className=c===category?"active":"";b.onclick=()=>{category=c;render()};filters.append(b)}results.replaceChildren();for(const [name,type,emoji,desc,price,query] of places.filter(p=>category==="全部"||p[1]===category)){const card=document.createElement("article");card.className="card";const tag=document.createElement("span");tag.className="tag";tag.textContent=emoji+" "+type;const h=document.createElement("h2");h.textContent=name;h.style.marginTop="10px";const d=document.createElement("p");d.textContent=desc;const cost=document.createElement("div");cost.className="muted";cost.textContent="參考預算："+price;const a=document.createElement("a");a.className="nav";a.href="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(query);a.target="_blank";a.rel="noopener noreferrer";a.textContent="📍 Google Maps 查詢與導航";card.append(tag,h,d,cost,a);results.append(card)}}render();</script></body></html>
