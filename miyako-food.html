<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eaf5ef"><title>宮古島｜推薦美食</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8faf5;color:#314b43;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}.wrap{max-width:650px;margin:auto;padding:18px 15px 70px}.back{color:#376c5b;text-decoration:none;font-weight:700}.hero{background:#e5f3e9;border-radius:23px;padding:21px;margin:14px 0}.hero h1{margin:7px 0;font-size:25px}p{line-height:1.6}.muted{color:#6a8075;font-size:12px}.filters{display:flex;gap:7px;overflow-x:auto;padding:7px 0 12px}.filters button,.sort{white-space:nowrap;border:1px solid #c9dcd1;background:#fff;padding:10px 12px;border-radius:24px;color:#456457;font-weight:650}.filters button.active,.primary{background:#397b66!important;color:#fff!important}.card{background:#fff;border:1px solid #e0e9e2;border-radius:18px;padding:15px;margin:12px 0;box-shadow:0 2px 8px #244b3510}.card h2{font-size:17px;margin:7px 0}.tag{display:inline-block;background:#edf6ee;border-radius:18px;padding:5px 9px;font-size:11px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.nav{display:block;text-align:center;background:#e5f2ea;color:#286c55;border-radius:12px;padding:12px;text-decoration:none;font-weight:700;margin-top:10px}.notice{background:#fff8e8;padding:13px;border-radius:12px;font-size:12px;line-height:1.7}.pic{height:135px;border-radius:14px;background:linear-gradient(130deg,#e6f1e9,#f8e7c9);display:flex;align-items:center;justify-content:center;font-size:58px;overflow:hidden}.pic small{font-size:11px;display:block}.locate{width:100%;border:0;border-radius:13px;padding:13px;background:#397b66;color:#fff;font-weight:800}.heart{border:0;background:#f6f5f1;border-radius:50%;padding:9px;font-size:18px}.sort{max-width:175px}.section{font-weight:800;margin:17px 0 4px}.stars{color:#c48b20;font-weight:800;font-size:13px}.empty{text-align:center;padding:24px;color:#7b8c82}
</style></head><body><main class="wrap"><a class="back" href="./index.html">← 返回宮古島 APP</a><section class="hero"><div class="muted">🐢 MIYAKO FAMILY TRIP</div><h1>🍽️ 宮古島推薦美食</h1><p>依地區找好吃的，或開啟定位探索附近餐廳 ♡</p></section>
<div class="card"><div class="row"><strong>📍 附近美食</strong><span id="gpsStatus" class="muted">尚未定位</span></div><p class="muted">授權定位後，會在本機計算距離；不會上傳你的 GPS 位置。</p><button class="locate" id="locate">📍 更新我的位置</button></div>
<div class="section">🏝️ 地區分類</div><div class="filters" id="areas"></div><div class="section">🍴 料理類型</div><div class="filters" id="types"></div><div class="row"><strong id="count">推薦餐廳</strong><select class="sort" id="sort"><option value="default">✨ 推薦排序</option><option value="near">📍 距離最近</option><option value="saved">❤️ 我的收藏</option></select></div><section id="results"></section>
<p class="notice">⭐ Google 評論星數與評論數需透過合規的 Google Places 資料來源才能顯示；試作版提供直接查看 Google 評論的連結，不會使用假評分。📷 餐廳實景照片需確認授權與來源後才能放入，目前以料理圖示佔位。GPS 距離僅在取得可靠餐廳座標時顯示。出發前請確認營業日與候位狀況。</p></main>
<script>
const places=[
{name:"Doug's Burger",area:"平良市區",type:"漢堡",emoji:"🍔",desc:"多良間牛肉漢堡、鮪魚排漢堡",query:"Doug's Burger Miyakojima"},
{name:"古謝そば屋",area:"平良市區",type:"宮古蕎麥麵",emoji:"🍜",desc:"傳統宮古蕎麥麵、軟骨排骨麵",query:"古謝そば屋 宮古島"},
{name:"麺屋サマー太陽",area:"平良市區",type:"拉麵",emoji:"🍜",desc:"蝦味噌風味麵食",query:"麺屋サマー太陽 宮古島"},
{name:"大和食堂",area:"平良市區",type:"在地料理",emoji:"🍱",desc:"沖繩家庭料理、宮古蕎麥麵",query:"大和食堂 宮古島"},
{name:"BRUAL",area:"平良市區",type:"漢堡",emoji:"🍔",desc:"美式漢堡與薯條",query:"BRUAL 宮古島"},
{name:"宮古そば どらえもん",area:"平良市區",type:"宮古蕎麥麵",emoji:"🍜",desc:"宮古麵與沖繩特色料理",query:"宮古そば どらえもん 宮古島"},
{name:"RICCO gelato",area:"平良市區",type:"甜點咖啡",emoji:"🍨",desc:"手工義式冰淇淋",query:"RICCO gelato 宮古島"},
{name:"Cafe Uesuya",area:"平良市區",type:"甜點咖啡",emoji:"☕",desc:"咖啡廳與創意料理",query:"Cafe Uesuya 宮古島"},
{name:"Blue Turtle",area:"伊良部島",type:"甜點咖啡",emoji:"🌊",desc:"海景咖啡與餐點",query:"Blue Turtle Miyakojima"},
{name:"AOSORA PARLOR",area:"來間島",type:"甜點咖啡",emoji:"🥭",desc:"水果冰沙與輕食",query:"AOSORA PARLOR Miyakojima"}
];
let area=new URLSearchParams(location.search).get("area")==="city"?"平良市區":"全部",type="全部",coords=null;const savedKey="miyako_food_favorites_v1";let saved=[];try{saved=JSON.parse(localStorage.getItem(savedKey)||"[]")}catch(e){}
const $=id=>document.getElementById(id);
function maps(q){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q)}
function chips(id,options,value,callback){$(id).replaceChildren();options.forEach(v=>{const b=document.createElement("button");b.textContent=v;b.className=v===value?"active":"";b.onclick=()=>callback(v);$(id).append(b)})}
function render(){chips("areas",["全部","平良市區","伊良部島","下地島","來間島","其他地區"],area,v=>{area=v;render()});chips("types",["全部","宮古蕎麥麵","拉麵","漢堡","在地料理","甜點咖啡"],type,v=>{type=v;render()});let list=places.filter(p=>(area==="全部"||p.area===area)&&(type==="全部"||p.type===type));if($("sort").value==="saved")list=list.filter(p=>saved.includes(p.name));$("count").textContent="推薦清單（"+list.length+"）";$("results").replaceChildren();if(!list.length){const e=document.createElement("p");e.className="empty";e.textContent="這個分類目前還沒有收錄餐廳";$("results").append(e)}
list.forEach(p=>{const card=document.createElement("article");card.className="card";const pic=document.createElement("div");pic.className="pic";pic.textContent=p.emoji;pic.setAttribute("aria-label","料理示意圖示，非店家照片");const top=document.createElement("div");top.className="row";const title=document.createElement("h2");title.textContent=p.name;const heart=document.createElement("button");heart.className="heart";heart.textContent=saved.includes(p.name)?"❤️":"🤍";heart.setAttribute("aria-label","收藏 "+p.name);heart.onclick=()=>{saved=saved.includes(p.name)?saved.filter(x=>x!==p.name):[...saved,p.name];try{localStorage.setItem(savedKey,JSON.stringify(saved))}catch(e){}render()};top.append(title,heart);const tag=document.createElement("span");tag.className="tag";tag.textContent=p.area+" · "+p.type;const desc=document.createElement("p");desc.textContent=p.desc;const rating=document.createElement("div");rating.className="stars";rating.textContent="⭐ Google 評分：點擊查看即時評論";const distance=document.createElement("p");distance.className="muted";distance.textContent=coords?"📍 尚待核實餐廳座標，無法計算可靠距離":"📍 開啟定位後可使用附近功能";const a=document.createElement("a");a.className="nav";a.href=maps(p.query);a.target="_blank";a.rel="noopener noreferrer";a.textContent="🗺️ 查看 Google 評論、照片及開車導航";card.append(pic,top,tag,desc,rating,distance,a);$("results").append(card)})}
$("sort").onchange=()=>{if($("sort").value==="near"&&!coords){$("gpsStatus").textContent="請先開啟定位"}render()};
$("locate").onclick=()=>{if(!navigator.geolocation){$("gpsStatus").textContent="此裝置不支援定位";return}$("gpsStatus").textContent="正在定位…";navigator.geolocation.getCurrentPosition(p=>{coords={lat:p.coords.latitude,lng:p.coords.longitude};$("gpsStatus").textContent="已取得位置（僅本機）";render()},e=>{$("gpsStatus").textContent=e.code===1?"定位未授權":"定位失敗，請再試一次"},{enableHighAccuracy:true,timeout:12000,maximumAge:60000})};render();
</script></body></html>
