function expenses(){const total=state.expenses.reduce((s,x)=>s+(x.currency==='JPY'?x.amount*x.rate:x.amount),0);return pageTitle('💰 家庭費用與結算','9 人分攤 · 日幣 JPY／台幣 TWD')+`<div class="card"><div class="label">目前記錄支出（約台幣）</div><div class="big-num">NT$ ${fmt(total)}</div><p class="muted">依各筆記錄當時匯率換算</p></div><div class="card"><h3>新增支出</h3><form id="expense-form"><input class="field" name="description" required maxlength="100" placeholder="支出項目，例如：午餐"><div class="row"><input class="field" name="amount" type="number" min="0.01" step="0.01" required placeholder="金額"><select class="field" name="currency"><option value="JPY">JPY 日幣</option><option value="TWD">TWD 台幣</option></select></div><label class="muted">1 JPY ≈ TWD（可自行調整）</label><input class="field" name="rate" type="number" min="0.0001" step="0.0001" value="${state.rate}" required><label class="muted">代墊者</label><select class="field" name="payer">${Array.from({length:9},(_,i)=>`<option value="${i+1}">家人 ${i+1}</option>`).join('')}</select><div class="muted">參與分攤者（預設全選）</div><div class="tiles" style="grid-template-columns:repeat(3,1fr);gap:5px;margin:9px 0">${Array.from({length:9},(_,i)=>`<label class="check" style="border:0;padding:5px;font-size:12px"><input name="member" type="checkbox" value="${i+1}" checked>家人 ${i+1}</label>`).join('')}</div><button class="btn full">記錄支出</button></form></div><div class="card"><h3>☁️ 家人共用費用（雲端）</h3><p class="muted">此區為家人共用的雲端支出紀錄，與上方本機費用分開保存。已核准的家人可讀寫共用資料；本機紀錄不會自動上傳或合併。</p><button class="btn secondary full" id="cloud-expense-load" type="button">檢查並讀取家人共用費用</button><p class="muted" id="cloud-expense-status" role="status">尚未連線；本機資料安全保留。</p><div id="cloud-expense-panel" class="hidden"><form id="cloud-expense-form"><input class="field" name="description" maxlength="100" required placeholder="共用支出項目"><div class="row"><input class="field" type="number" name="amount" min="0.01" step="0.01" required placeholder="金額"><select class="field" name="currency"><option value="JPY">JPY 日幣</option><option value="TWD">TWD 台幣</option></select></div><label class="muted">1 JPY 換算台幣</label><input class="field" type="number" name="rate" min="0.0001" step="0.0001" value="0.21" required><label class="muted">代墊者</label><select class="field" name="payer">${Array.from({length:9},(_,i)=>`<option value="${i+1}">家人 ${i+1}</option>`).join('')}</select><p class="muted">分攤成員（預設 9 人）</p><div class="tiles" style="grid-template-columns:repeat(3,1fr);gap:5px">${Array.from({length:9},(_,i)=>`<label class="check" style="border:0;padding:5px;font-size:12px"><input name="member" type="checkbox" value="${i+1}" checked>家人 ${i+1}</label>`).join('')}</div><button class="btn full">☁️ 儲存至家人雲端</button></form><h3 style="margin-top:20px">共用支出紀錄</h3><div id="cloud-expense-list"></div></div></div><div class="card"><h3>支出紀錄</h3>${state.expenses.length?state.expenses.map(x=>`<div class="expense"><div class="row"><b>${escapeHtml(x.description)}</b><b>${x.currency} ${fmt(x.amount)}</b></div><p class="muted">家人 ${x.payer} 代墊 · ${x.members.length} 人分攤 · 每人 ${x.currency} ${fmt(x.amount/x.members.length)}</p><button class="btn danger" data-expense-delete="${x.id}">刪除</button></div>`).join(''):`<div class="empty">尚未記錄任何費用</div>`}</div><div class="card"><h3>代墊淨額（折合台幣）</h3>${Array.from({length:9},(_,i)=>{let n=i+1;let balance=state.expenses.reduce((s,x)=>s+(x.payer===n?x.amount*(x.currency==='JPY'?x.rate:1):0)-(x.members.includes(n)?x.amount*(x.currency==='JPY'?x.rate:1)/x.members.length:0),0);return `<div class="row" style="padding:8px 0"><span>家人 ${n}</span><b>${balance>=0?'應收':'應付'} NT$ ${fmt(Math.abs(balance))}</b></div>`}).join('')}</div><div class="card"><h3>💸 建議轉帳結算</h3><p class="muted">依照目前每筆支出的代墊者、分攤者與記錄匯率計算。以下均折合台幣，僅供家人自行核對，尚未記錄實際轉帳。</p>${settlementSuggestions()}</div><div class="card"><h3>本機費用備份與還原</h3><p class="muted">這裡僅備份上方的本機費用，不包含家人雲端共用費用。更換手機或清除網站資料前，請先匯出本機備份。</p><button class="btn secondary full" type="button" id="expense-export">⬇️ 匯出費用備份（JSON）</button><label class="muted" for="expense-import" style="display:block;margin-top:14px">📂 從先前的 JSON 備份還原費用</label><input class="field" id="expense-import" type="file" accept=".json,application/json"><p class="muted">還原前會檢查資料，並詢問是否合併；相同 ID 的紀錄不會重複加入。</p><p class="muted" id="expense-backup-status" role="status"></p></div><div class="note">本機費用可計算平均分攤及建議轉帳；家人雲端費用請使用上方共用區。兩區資料不會自動合併，建議轉帳結果僅依本機紀錄計算，並非實際轉帳或收款確認。</div>`}
function settlementSuggestions(){
 const balances=Array.from({length:9},()=>0);
 for(const x of state.expenses){
  const amount=Number(x.amount)*(x.currency==='JPY'?Number(x.rate):1);
  const payer=Number(x.payer)-1;
  const members=Array.isArray(x.members)?[...new Set(x.members.map(Number))].filter(n=>n>=1&&n<=9):[];
  if(!Number.isFinite(amount)||amount<=0||payer<0||payer>=9||!members.length)continue;
  balances[payer]+=amount;
  for(const n of members)balances[n-1]-=amount/members.length;
 }
 // Round once to integer cents and allocate rounding remainder deterministically.
 const cents=balances.map(n=>Math.round(n*100));
 const remainder=cents.reduce((a,b)=>a+b,0);
 if(remainder)cents[0]-=remainder;
 const owes=cents.map((n,i)=>({i,n:-n})).filter(x=>x.n>0);
 const owed=cents.map((n,i)=>({i,n})).filter(x=>x.n>0);
 let a=0,b=0;const transfers=[];
 while(a<owes.length&&b<owed.length){
  const amount=Math.min(owes[a].n,owed[b].n);
  if(amount>0)transfers.push(`家人 ${owes[a].i+1} → 家人 ${owed[b].i+1}：NT$ ${fmt(amount/100)}`);
  owes[a].n-=amount;owed[b].n-=amount;
  if(!owes[a].n)a++;if(!owed[b].n)b++;
 }
 return transfers.length?transfers.map(t=>`<div class="row" style="padding:10px 0;border-bottom:1px solid #e9efea"><b>${escapeHtml(t)}</b></div>`).join(''):'<div class="empty">目前沒有需要結算的款項 🌱</div>';
}

  if(k==='rate')return typeof v==='number'&&Number.isFinite(v)&&v>0&&v<10000;
  if(k==='checks')return safeObject(v)&&Object.keys(v).length<=500&&Object.entries(v).every(([a,b])=>a.length<150&&typeof b==='boolean');
  if(k==='memos')return Array.isArray(v)&&v.length<=2000&&v.every(x=>safeObject(x)&&typeof x.id==='string'&&x.id.length<150&&typeof x.text==='string'&&x.text.length<=10000&&typeof x.done==='boolean');
  if(k==='expenses')return Array.isArray(v)&&v.length<=10000&&v.every(x=>safeObject(x)&&typeof x.id==='string'&&x.id.length<150&&typeof x.description==='string'&&x.description.length<=500&&typeof x.amount==='number'&&Number.isFinite(x.amount)&&x.amount>0&&typeof x.rate==='number'&&Number.isFinite(x.rate)&&x.rate>0&&['JPY','TWD'].includes(x.currency)&&Number.isInteger(x.payer)&&x.payer>=0&&x.payer<9&&Array.isArray(x.members)&&x.members.length>0&&x.members.length<=9&&x.members.every(n=>Number.isInteger(n)&&n>=0&&n<9));
  if(k==='settlements')return Array.isArray(v)&&v.length<=10000&&JSON.stringify(v).length<1000000;
  if(k==='notifications')return Array.isArray(v)&&v.length<=1000&&JSON.stringify(v).length<200000;
  if(k==='editedDays')return safeObject(v)&&Object.keys(v).length<=20&&JSON.stringify(v).length<300000;
  return false;
 };
 document.addEventListener('change',async e=>{
  if(e.target.id!=='trip-backup-import')return;
  const file=e.target.files?.[0],out=document.getElementById('trip-backup-import-status');
  if(!file)return;
  try{
   if(file.size>2*1024*1024)throw Error('檔案超過 2 MB 上限');
   const backup=JSON.parse(await file.text());
   if(!safeObject(backup)||backup.format!=='miyako-local-trip-backup'||backup.version!==1||!safeObject(backup.data))throw Error('不是相容的宮古島本機旅行備份');
   const keys=Object.keys(backup.data);
   if(!keys.length||keys.some(k=>!allowed.includes(k)||!valid(k,backup.data[k])))throw Error('備份資料不完整、格式不符或包含未允許的欄位');
   if(keys.includes('expenses')){const ids=backup.data.expenses.map(x=>x.id);if(new Set(ids).size!==ids.length)throw Error('費用備份有重複 ID，已拒絕還原');}
   const summary=keys.join('、');
   if(!confirm('準備還原以下本機資料：'+summary+'。\n\n這會覆蓋這台手機相同類別的本機資料，但不會修改登入身分、雲端資料或照片。\n請確認已先匯出目前資料。\n\n確定還原嗎？')){out.textContent='已取消還原，原資料不變。';return;}
   const previous=new Map();
   try{
    for(const k of keys)previous.set(k,localStorage.getItem('miyako_'+k));
    for(const k of keys)localStorage.setItem('miyako_'+k,JSON.stringify(backup.data[k]));
   }catch(err){
    for(const [k,v] of previous){try{if(v===null)localStorage.removeItem('miyako_'+k);else localStorage.setItem('miyako_'+k,v)}catch{}}
    throw Error('儲存空間不足或被瀏覽器拒絕，已嘗試還原原本資料');
   }
   out.textContent='✓ 本機資料已還原。正在重新載入畫面。';
   location.reload();
  }catch(err){out.textContent='無法還原：'+err.message;}
  finally{e.target.value='';}
 });
})();
