// v3.3.35: uncompressed ZIP backups for local albums; no external library or cloud access.

  h.setUint16(8,0,true);h.setUint32(14,crc,true);h.setUint32(18,length,true);h.setUint32(22,length,true);

// v3.3.36: read the uncompressed ZIP format exported by v3.3.35.
// Bound all sizes and verify offsets and CRC before any photos are added.
function readAlbumZip(bytes){
 if(bytes.byteLength>40*1024*1024)throw Error('ZIP 超過 40 MB，請選擇原本每批最多 10 張的備份');
 const dv=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength),len=bytes.length;
 const u16=p=>dv.getUint16(p,true),u32=p=>dv.getUint32(p,true);
 let end=-1;
 for(let p=len-22;p>=Math.max(0,len-65557);p--){
  if(u32(p)===0x06054B50&&p+22+u16(p+20)===len){end=p;break}
 }
 if(end<0)throw Error('找不到有效 ZIP 目錄結尾');
 const count=u16(end+10),centralSize=u32(end+12),centralOffset=u32(end+16);
 if(count<2||count>11||u16(end+8)!==count||u16(end+4)!==0||u16(end+6)!==0||centralOffset+centralSize>end)throw Error('ZIP 結構不符合本 App 的照片備份格式');
 let p=centralOffset,total=0;
 const entries=new Map(),decoder=new TextDecoder('utf-8',{fatal:true});
 for(let i=0;i<count;i++){
  if(p+46>centralOffset+centralSize||u32(p)!==0x02014B50)throw Error('ZIP 目錄資料損毀');
  const flags=u16(p+8),method=u16(p+10),crc=u32(p+16),compressed=u32(p+20),size=u32(p+24),
   nameLength=u16(p+28),extra=u16(p+30),comment=u16(p+32),offset=u32(p+42);
  if(flags!==0x0800||method!==0||compressed!==size||size>20*1024*1024||offset>=centralOffset)throw Error('只支援本 App 匯出的未壓縮照片 ZIP');
  if(p+46+nameLength+extra+comment>centralOffset+centralSize)throw Error('ZIP 目錄長度無效');
  const name=decoder.decode(bytes.subarray(p+46,p+46+nameLength));
  if(name!=='photo-list.json'&&!/^photo-\d{3}-[a-zA-Z0-9-]{1,50}\.jpg$/.test(name))throw Error('ZIP 包含非預期的檔名');
  if(entries.has(name)||offset+30>centralOffset||u32(offset)!==0x04034B50)throw Error('ZIP 包含重複檔名或檔案標頭損毀');
  const localNameLength=u16(offset+26),localExtra=u16(offset+28),start=offset+30+localNameLength+localExtra;
  if(u16(offset+6)!==flags||u16(offset+8)!==0||u32(offset+14)!==crc||u32(offset+18)!==size||u32(offset+22)!==size||start+size>centralOffset)throw Error('ZIP 檔案內容長度不符');
  if(decoder.decode(bytes.subarray(offset+30,offset+30+localNameLength))!==name)throw Error('ZIP 檔名不一致');
  const data=bytes.subarray(start,start+size);
  if(albumCrc32(data)!==crc)throw Error('ZIP 照片或說明資料已損毀');
  total+=size;if(total>35*1024*1024)throw Error('備份照片容量超過支援上限');
  entries.set(name,data);p+=46+nameLength+extra+comment;
 }
 if(p!==centralOffset+centralSize||!entries.has('photo-list.json'))throw Error('ZIP 缺少備份清單');
 let manifest;
 try{manifest=JSON.parse(decoder.decode(entries.get('photo-list.json')))}catch{throw Error('照片清單 JSON 無法讀取')}
 if(manifest?.type!=='miyako-trip-photo-backup'||typeof manifest.tripId!=='string'||manifest.tripId.length>150||
    !Array.isArray(manifest.photos)||manifest.photos.length!==entries.size-1||manifest.photos.length>10)throw Error('不是本 App v3.3.35 相簿備份格式');
 const photos=[],used=new Set();
 for(const item of manifest.photos){
  if(!item||typeof item.file!=='string'||used.has(item.file)||!entries.has(item.file)||
    typeof item.caption!=='string'||item.caption.length>80||
    typeof item.createdAt!=='string'||item.createdAt.length>80)throw Error('照片說明格式不符');
  const data=entries.get(item.file);
  if(data.length<4||data[0]!==0xFF||data[1]!==0xD8||data[2]!==0xFF)throw Error('照片 JPEG 內容不符');
  used.add(item.file);
  photos.push({...item,blob:new Blob([data],{type:'image/jpeg'})});
 }

}

let draftTripDeletionBusy=false;
async function removeDraftTripSafely(id){
 if(draftTripDeletionBusy)return;
 draftTripDeletionBusy=true;
 try{
  const all=tripDraftList(),trip=all.find(x=>x.id===id);
  if(!trip)return;
  let photoCount;
  try{photoCount=(await draftPhotos(id)).length}
  catch(err){alert('無法確認這趟旅行的本機照片，已取消刪除。請先檢查相簿：'+err.message);return}
  const items=[
   ['每日行程',draftEvents(id).length],
   ['航班',draftLogistics(id).flights.length],
   ['住宿',draftLogistics(id).stays.length],
   ['費用',draftExpenses(id).length],
   ['同行者',draftPeople(id).length],
   ['地點',draftLocations(id).length],
   ['行李項目',draftPacking(id).length],
   ['備忘',draftNotes(id).length],
   ['本機照片',photoCount]
  ];
  const summary=items.filter(([name,count])=>count>0).map(([name,count])=>`${name} ${count} 筆`).join('、')||'目前沒有新增內容';
  const prompt=`⚠️ 確定永久刪除「${trip.name}」？\n\n會一併刪除：${summary}。\n\nJSON 備份不包含照片。若有照片，請先進入這趟旅行的相簿下載 ZIP，並確認檔案已保存。\n\n刪除後無法直接復原；宮古島原本的九人共用資料不受影響。`;
  if(!confirm(prompt))return;
  // The tab might have changed while awaiting IndexedDB. Recheck identity before mutation.
  if(!tripDraftList().some(x=>x.id===id))return;
  const datasets=[
   [draftAgendaKey,draftAgendaMap()],
   [draftLogisticsKey,draftLogisticsMap()],
   [draftExpenseKey,draftExpenseMap()],
   [draftCurrencyKey,draftCurrencyMap()],
   [draftPeopleKey,draftPeopleMap()],
   [draftLocationsKey,draftLocationsMap()],
   [draftPackingKey,draftPackingMap()],
   [draftNotesKey,draftNotesMap()],
   [tripDraftsKey,all]
  ];
  const saved=[];
  try{
   for(const [key,current] of datasets){
    const next=key===tripDraftsKey?current.filter(x=>x.id!==id):{...current};
    if(key!==tripDraftsKey)delete next[id];
    put(key,next);saved.push([key,current]);
   }
  }catch(err){
   for(const [key,previous] of saved.reverse())try{put(key,previous)}catch{}
   alert('刪除未完成：本機資料儲存發生錯誤，已嘗試回復。請重新檢查旅行資料。');
   return;
  }
  // Do not remove the travel entry from the UI before IndexedDB confirms deletion.
  // If photo deletion fails, reinstate all saved local travel records.
  try{await draftPhotoDeleteTrip(id)}
  catch(err){
   let rolledBack=true;
   for(const [key,previous] of saved.reverse()){
    try{put(key,previous)}catch{rolledBack=false}
   }
   if(rolledBack){
    alert('照片未能刪除，已取消整趟旅行的刪除並恢復原本清單。請先確認照片備份，再重新嘗試：'+err.message);
   }else{
    alert('照片清理失敗，且部分旅行資料無法自動回復。請勿清除網站資料，先檢查旅行清單與備份：'+err.message);
   }
   render();
   return;
  }
  if(state.openDraftTripId===id)state.openDraftTripId=null;
  render();
 }finally{draftTripDeletionBusy=false}
}

 `<div class="row itinerary-mode-bar"><span class="muted">${canEdit?'✏️ 編輯模式：可調整行程':'👀 瀏覽模式：避免誤觸修改'}</span><div class="row" style="gap:7px;flex-wrap:wrap;justify-content:flex-end">${canEdit&&state.day>=4?`<button class="btn danger" type="button" data-action="delete-itinerary-date">🗑️ 刪除日期</button>`:''}<button class="btn secondary" data-action="toggle-itinerary-edit">${canEdit?'✓ 完成編輯':'✏️ 編輯行程'}</button></div></div><div class="card itinerary-card"><h3>📅 ${days[state.day].name} · 今日安排</h3>${ev.length?'':'<p class="muted">這一天還沒有行程，開啟編輯模式即可新增活動。</p>'}${ev.map((e,i)=>`<div class="schedule-row"><div class="schedule-clock">${escapeHtml(itineraryClock(e))}</div><div class="schedule-info"><b>${escapeHtml(e[1])}</b>${e[2]?`<p>${escapeHtml(e[2])}</p>`:''}<div class="schedule-meta">${durationOf(e)} 分鐘 · ${fixedEvent(e)?'🔒 固定時間':'✨ 彈性行程'}</div>${canEdit&&!fixedEvent(e)?`<div class="duration-strip">${[30,45,60,90].map(n=>`<button class="duration-btn ${durationOf(e)===n?'active':''}" data-duration-index="${i}" data-duration="${n}">${n} 分</button>`).join('')}</div>`:''}${canEdit?`<div class="event-controls"><button class="mini-btn" data-event-edit="${i}">編輯</button>${!fixedEvent(e)?`<button class="mini-btn danger-text" data-event-delete="${i}">刪除</button>`:''}</div>`:''}</div></div>`).join('')}</div>`+

 <div class="itinerary-bottom"><button class="btn smart-btn full" data-action="smart-time">✧ 智慧重新安排時間</button><button class="btn secondary full" data-action="restore-day">恢復 Day ${state.day+1} 原始行程</button></div><p class="notice">智慧安排依各站停留時間與 15 分鐘緩衝估算，並非即時地圖車程。固定預訂不移動；目前只儲存在這台裝置。</p>`:'')

function mapsNavigationContent(){
 const officialSite=url=>/^https:\/\/(?:www\.)?hilton\.com\//i.test(url||'');
 const mapUrl=(query,url)=>url&&/^https:\/\/(?:www\.)?(?:maps\.google\.com|google\.com\/maps)\//i.test(url)
   ?url:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(query);
 // Search results are only discovery aids: do not label them as verified pins.
 const pending=[
  {name:'🚙 Toyota 租車取還車',text:'兩台車的實際取車、還車分店尚未確認。請以租車預約確認書為準。',query:'Toyota Rent a Car Miyakojima'},
  {name:'🤿 MONKEY NAVY 浮潛集合點',text:'集合地址尚未確認；海邊活動的集合地點可能不同於業者營業地址。請以預約通知為準。',query:'MONKEY NAVY Miyakojima'}
 ];
 return `<div class="card"><h3>⚠️ 出發前待確認（2 項）</h3>${pending.map(x=>`<div style="padding:11px 0;border-top:1px solid #eef2ec"><b>${escapeHtml(x.name)}</b><p class="muted" style="margin:6px 0">${escapeHtml(x.text)}</p><a class="small-link" target="_blank" rel="noopener noreferrer" href="${escapeHtml('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(x.query))}">🔎 僅搜尋參考（非集合點）</a></div>`).join('')}</div>`+
 `<div class="card"><h3>🗺️ 景點與餐廳</h3><p class="muted">選擇 Google 地圖搜尋後，請核對店名與地址。已提供地圖網址的民宿仍建議對照訂房資料。</p>${places.filter(([name])=>!/MONKEY NAVY/.test(name)).map(([name,query,url])=>{
   const mapped=Boolean(query||url&&!officialSite(url));
   const actions=[];
   if(mapped)actions.push(`<a class="small-link" href="${escapeHtml(mapUrl(query||name+' Miyakojima',url))}" target="_blank" rel="noopener noreferrer">📍 ${query?'Google 地圖搜尋':'Google 地圖連結'}</a>`);
   if(officialSite(url)){
     actions.push(`<a class="small-link" href="${escapeHtml(mapUrl(query||name+' Miyakojima',url))}" target="_blank" rel="noopener noreferrer">📍 Google 地圖搜尋</a>`);
     actions.push(`<a class="small-link" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">🏨 官方網站</a>`);
   }
   return `<div style="padding:12px 0;border-bottom:1px solid #eef2ec"><b style="font-size:13px">${escapeHtml(name)}</b><div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:9px">${actions.join('')}</div></div>`;
 }).join('')}</div><div class="note">ℹ️ App 不會擅自填入未核實的租車分店、浮潛集合地址；出發前以預約確認書為準。</div>`;
}
function packing(){
 const groups=state.packing==='travel'?travelGroups:snorkel;
 const all=groups.flatMap(x=>x[1]);
 const done=all.filter(item=>state.checks[state.packing+'|'+item]).length;
 const remaining=all.length-done;
 const onlyPending=state.packingFilter==='pending';
 const filterButtons=`<div class="row" style="gap:8px;flex-wrap:wrap;margin-top:14px" role="group" aria-label="行李清單篩選">
  <button class="btn secondary" type="button" data-action="packing-filter" data-filter="all" aria-pressed="${!onlyPending}" style="font-size:13px;padding:9px 12px;${!onlyPending?'background:#dceee7;':''}">全部物品</button>
  <button class="btn secondary" type="button" data-action="packing-filter" data-filter="pending" aria-pressed="${onlyPending}" style="font-size:13px;padding:9px 12px;${onlyPending?'background:#dceee7;':''}">只看未完成（${remaining}）</button></div>`;
 return pageTitle('🧳 個人行李清單','每個裝置獨立勾選，不影響其他家人。')+
  tabs(['旅行用品','浮潛專用'],state.packing==='travel'?0:1,'packing')+
  `<div class="card"><div class="row"><b>完成進度</b><b>${done} / ${all.length}</b></div><div class="progress" style="margin:12px 0"><i style="width:${all.length?done/all.length*100:0}%"></i></div><button class="btn secondary" data-action="reset">重新檢查清單</button>${filterButtons}</div>`+
  groups.map(([group,items])=>{
   const pendingItems=items.filter(item=>!state.checks[state.packing+'|'+item]);
   const shownItems=onlyPending?pendingItems:items;
   const groupDone=items.length-pendingItems.length;
   // The filter is display-only. Original check keys and local storage remain unchanged.
   if(onlyPending&&!shownItems.length)return '';
   return `<div class="card"><div class="row"><h3 style="margin:0">${group}</h3><small class="muted">${groupDone}/${items.length} 完成</small></div>`+
    shownItems.map(item=>`<label class="check ${state.checks[state.packing+'|'+item]?'done':''}"><input type="checkbox" data-check="${escapeHtml(state.packing+'|'+item)}" ${state.checks[state.packing+'|'+item]?'checked':''}><span>${escapeHtml(item)}</span></label>`).join('')+'</div>';
  }).join('')+
  (onlyPending&&!remaining?'<div class="card" style="text-align:center">🎉 太棒了！這份清單已全部完成。</div>':'')+
  (state.packing==='snorkel'?`<div class="note">🚿 現場只有簡易淋浴設備，主要沖掉海水，不能使用洗髮精或沐浴乳；沒有更衣室，廁所設備簡單。建議穿好泳衣出發，活動結束後回民宿正式梳洗。</div>`:'');
}

function settlementSuggestions(){
 const balances=Array.from({length:9},()=>0);
 for(const x of state.expenses){
  const amount=Number(x.amount)*(x.currency==='JPY'?Number(x.rate):1);
  const payer=Number(x.payer)-1;
  const members=Array.isArray(x.members)?[...new Set(x.members.map(Number))].filter(n=>n>=1&&n<=9):[];
  if(!Number.isFinite(amount)||amount<=0||payer<0||payer>=9||!members.length)continue;
  balances[payer]+=amount;
  for(const n of members)balances[n-1]-=amount/members.length;
 }
 // Round once to integer cents and allocate rounding remainder deterministically.
 const cents=balances.map(n=>Math.round(n*100));
 const remainder=cents.reduce((a,b)=>a+b,0);
 if(remainder)cents[0]-=remainder;
 const owes=cents.map((n,i)=>({i,n:-n})).filter(x=>x.n>0);
 const owed=cents.map((n,i)=>({i,n})).filter(x=>x.n>0);
 let a=0,b=0;const transfers=[];
 while(a<owes.length&&b<owed.length){
  const amount=Math.min(owes[a].n,owed[b].n);
  if(amount>0)transfers.push(`家人 ${owes[a].i+1} → 家人 ${owed[b].i+1}：NT$ ${fmt(amount/100)}`);
  owes[a].n-=amount;owed[b].n-=amount;
  if(!owes[a].n)a++;if(!owed[b].n)b++;
 }
 return transfers.length?transfers.map(t=>`<div class="row" style="padding:10px 0;border-bottom:1px solid #e9efea"><b>${escapeHtml(t)}</b></div>`).join(''):'<div class="empty">目前沒有需要結算的款項 🌱</div>';
}

tton" id="identity-recovery-readiness">檢查這台手機的恢復準備狀態</button><p id="identity-recovery-result" class="muted" role="status" aria-live="polite">尚未檢查（只讀取本機登入資料及到期時間，不會傳送登入憑證）</p><p class="muted">需要家人管理員協助時，可複製不含密碼的狀態摘要；摘要不會恢復登入，也不會更改家人核准狀態。</p><button class="btn secondary full" type="button" id="identity-support-copy">複製安全狀態摘要</button><p id="identity-support-result" class="muted" role="status" aria-live="polite">不會複製登入憑證、完整使用者 ID 或私人照片。</p></details><details open><summary>🧳 旅行資料安全備份</summary><p class="muted">一鍵匯出這台手機的本機旅行資料：包含已調整的宮古島行程日期及內容、其他旅行草稿、獨立行程、地點及費用、行李勾選、備忘、費用、結算紀錄、通知及暱稱。檔案不含登入憑證、完整家人 ID、相簿照片（含其他旅行本機照片）或雲端資料。新旅行的相片請另下載 ZIP 備份。建議出發前保存一份。</p><button class="btn secondary full" type="button" id="trip-backup-export">⬇️ 匯出本機旅行資料（JSON）</button><p class="muted">需要還原時，先選擇先前匯出的 JSON。會預覽資料類別並要求再次確認；不會匯入登入憑證或修改家人雲端身分。建議先匯出目前資料作備份。</p><label class="label" for="trip-backup-import">選擇本機備份檔</label><input class="field" type="file" id="trip-backup-import" accept=".json,application/json"><p id="trip-backup-import-status" class="muted" role="status" aria-live="polite">尚未選擇備份。選擇檔案只會檢查，不會還原。</p><div id="trip-backup-preview" class="hidden" style="background:#f1f8f3;border:1px solid #d4e4d7;border-radius:14px;padding:14px;margin:12px 0"><b>🔎 備份檔案預覽（唯讀）</b><div id="trip-backup-preview-list" style="margin:10px 0"></div><p class="notice">⚠️ 如果預覽後手機資料有變更，會要求重新預覽。還原只會覆蓋下方列出的本機資料類別；沒有列出的類別不會被清除。請先另外匯出目前資料；雲端共用資料、登入身分與照片不會被此功能還原。</p><div class="row" style="gap:8px;flex-wrap:wrap"><button type="button" class="btn secondary" id="trip-backup-cancel">取消</button><button type="button" class="btn danger" id="trip-backup-restore-confirm">確認還原本機資料</button></div></div><p class="muted" id="trip-backup-status" role="status" aria-live="polite">尚未匯出。此備份不能恢復登入身分，也不代表雲端同步。</p></details><details><summary>🔔 通知與離線</summary><p class="muted">基本頁面提供離線快取。推播通知、離線寫入後同步尚未實作。</p></details>`}
